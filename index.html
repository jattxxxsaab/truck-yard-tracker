<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Truck Yard Intelligence Dashboard</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #121a2e;
      --panel-2: #16213a;
      --border: #27324f;
      --text: #e8eefc;
      --muted: #9fb0d3;
      --accent: #56a8ff;
      --good: #41d98a;
      --warn: #ffd166;
      --bad: #ff6b6b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    .wrap {
      max-width: 1300px;
      margin: 0 auto;
      padding: 20px;
    }

    .header {
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 28px;
    }

    .sub {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.4;
    }

    .last-updated {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin: 18px 0;
    }

    .stat {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }

    .stat .label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .stat .value {
      font-size: 24px;
      font-weight: 700;
    }

    .controls {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .controls input,
    .controls select {
      width: 100%;
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-size: 14px;
    }

    .list {
      display: grid;
      gap: 10px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .addr {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .meta {
      color: var(--muted);
      font-size: 13px;
    }

    .price {
      font-size: 20px;
      font-weight: 700;
      color: var(--good);
    }

    .chips {
      margin: 8px 0;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .chip {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px 9px;
      font-size: 12px;
      color: var(--muted);
      background: var(--panel-2);
    }

    .chip.active { color: var(--good); border-color: rgba(65, 217, 138, 0.5); }
    .chip.new { color: var(--accent); border-color: rgba(86, 168, 255, 0.5); }
    .chip.updated { color: var(--warn); border-color: rgba(255, 209, 102, 0.5); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 8px;
      margin-top: 8px;
    }

    .kv {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      font-size: 13px;
      line-height: 1.35;
    }

    .kv b { color: var(--muted); font-weight: 600; display: block; margin-bottom: 2px; }

    .links {
      margin-top: 10px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .links a {
      color: var(--accent);
      text-decoration: none;
      font-size: 13px;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 28px;
      border: 1px dashed var(--border);
      border-radius: 12px;
      background: var(--panel);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <h1>Truck Yard Intelligence Dashboard</h1>
      <div class="sub">
        Cities: Ripon, Salida, Modesto, Ceres, Keyes, Turlock, Merced, Livingston, Winton<br />
        Focus: Truck yards, RV parking, and truck mechanic opportunities with zoning validation.
      </div>
      <div class="last-updated" id="lastUpdated">Last updated: --</div>
    </div>

    <div class="stats" id="stats"></div>

    <div class="controls">
      <input id="search" type="text" placeholder="Search address, city, source, notes" />
      <select id="cityFilter"><option value="all">All cities</option></select>
      <select id="statusFilter">
        <option value="all">All statuses</option>
        <option value="new">NEW</option>
        <option value="updated">UPDATED</option>
      </select>
      <select id="typeFilter">
        <option value="all">All types</option>
        <option value="yard">Yard</option>
        <option value="industrial">Industrial</option>
        <option value="land">Land</option>
      </select>
      <select id="sortBy">
        <option value="score">Sort by score</option>
        <option value="recent">Most recent</option>
        <option value="priceLow">Price low to high</option>
        <option value="priceHigh">Price high to low</option>
      </select>
    </div>

    <div class="list" id="listings"></div>
  </div>

  <script>
    let data = { listings: [], summary: {} };

    function num(v) {
      const n = Number(v);
      return Number.isFinite(n) ? n : null;
    }

    function parsePrice(v) {
      if (v == null) return null;
      if (typeof v === 'number') return v;
      const cleaned = String(v).replace(/[^0-9.]/g, '');
      return cleaned ? Number(cleaned) : null;
    }

    function fmtDate(v) {
      if (!v) return '--';
      const d = new Date(v);
      if (Number.isNaN(d.getTime())) return v;
      return d.toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short', timeZone: 'America/Los_Angeles' });
    }

    function fmtPrice(row) {
      if (row.price) return row.price;
      const p = parsePrice(row.priceNum);
      return p ? `$${Math.round(p).toLocaleString()}` : 'Contact';
    }

    function scoreVal(row) {
      return num(row.score) || 0;
    }

    function mapType(v) {
      const t = String(v || '').toLowerCase();
      if (t.includes('industrial')) return 'industrial';
      if (t.includes('land')) return 'land';
      if (t.includes('yard')) return 'yard';
      return t || 'other';
    }

    function toStatus(row) {
      const s = String(row.changeType || row.status || '').toLowerCase();
      if (s.includes('new')) return 'new';
      if (s.includes('updated')) return 'updated';
      return 'existing';
    }

    function buildStats(listings) {
      const newCount = listings.filter(x => toStatus(x) === 'new').length;
      const updatedCount = listings.filter(x => toStatus(x) === 'updated').length;
      const activeCount = listings.filter(x => String(x.listingStatus || x.status || '').toLowerCase().includes('active') || String(x.status || '').toLowerCase() === 'active').length;
      const highScore = listings.filter(x => scoreVal(x) >= 4).length;

      document.getElementById('stats').innerHTML = `
        <div class="stat"><div class="label">Active listings</div><div class="value">${activeCount}</div></div>
        <div class="stat"><div class="label">New today</div><div class="value">${newCount}</div></div>
        <div class="stat"><div class="label">Updated today</div><div class="value">${updatedCount}</div></div>
        <div class="stat"><div class="label">Score 4-5</div><div class="value">${highScore}</div></div>
      `;
    }

    function populateCityFilter(listings) {
      const cities = [...new Set(listings.map(x => x.city).filter(Boolean))].sort();
      const el = document.getElementById('cityFilter');
      el.innerHTML = '<option value="all">All cities</option>' + cities.map(c => `<option value="${c}">${c}</option>`).join('');
    }

    function renderListings() {
      const q = document.getElementById('search').value.trim().toLowerCase();
      const city = document.getElementById('cityFilter').value;
      const status = document.getElementById('statusFilter').value;
      const type = document.getElementById('typeFilter').value;
      const sortBy = document.getElementById('sortBy').value;

      let rows = [...(data.listings || [])];

      rows = rows.filter(r => {
        const statusV = toStatus(r);
        const typeV = mapType(r.type || r.propertyType);
        const text = [r.address, r.city, r.source, r.claimedUse, r.notes, r.zoningDecision].join(' ').toLowerCase();
        if (city !== 'all' && (r.city || '') !== city) return false;
        if (status !== 'all' && statusV !== status) return false;
        if (type !== 'all' && typeV !== type) return false;
        if (q && !text.includes(q)) return false;
        return true;
      });

      if (sortBy === 'score') rows.sort((a, b) => scoreVal(b) - scoreVal(a));
      if (sortBy === 'recent') rows.sort((a, b) => new Date(b.lastSeen || b.dateFound || 0) - new Date(a.lastSeen || a.dateFound || 0));
      if (sortBy === 'priceLow') rows.sort((a, b) => (parsePrice(a.priceNum || a.price) || Number.MAX_SAFE_INTEGER) - (parsePrice(b.priceNum || b.price) || Number.MAX_SAFE_INTEGER));
      if (sortBy === 'priceHigh') rows.sort((a, b) => (parsePrice(b.priceNum || b.price) || 0) - (parsePrice(a.priceNum || a.price) || 0));

      const host = document.getElementById('listings');
      if (!rows.length) {
        host.innerHTML = '<div class="empty">No listings match current filters.</div>';
        return;
      }

      host.innerHTML = rows.map(r => {
        const statusV = toStatus(r);
        const score = scoreVal(r);
        const confidence = r.confidence || '--';
        const sourceUrl = r.sourceUrl || r.url || '';
        const zoning = r.zoningDecision || r.zoning || '--';

        return `
          <div class="card">
            <div class="top">
              <div>
                <div class="addr">${r.address || r.apn || 'Unknown property'}</div>
                <div class="meta">${r.city || '--'} | ${r.type || r.propertyType || 'Unknown type'} | Last seen: ${fmtDate(r.lastSeen || r.dateFound)}</div>
              </div>
              <div class="price">${fmtPrice(r)}</div>
            </div>

            <div class="chips">
              <span class="chip active">ACTIVE</span>
              ${statusV === 'new' ? '<span class="chip new">NEW</span>' : ''}
              ${statusV === 'updated' ? '<span class="chip updated">UPDATED</span>' : ''}
              <span class="chip">Score ${score || '--'}</span>
              <span class="chip">Confidence ${confidence}</span>
              ${r.acres ? `<span class="chip">${r.acres} acres</span>` : ''}
            </div>

            <div class="grid">
              <div class="kv"><b>Zoning</b>${zoning}</div>
              <div class="kv"><b>Truck yard use</b>${r.truckYardUse || '--'}</div>
              <div class="kv"><b>Mechanic shop use</b>${r.mechanicShopUse || '--'}</div>
              <div class="kv"><b>Source</b>${r.source || '--'}</div>
              <div class="kv"><b>Freeway proximity</b>${r.freewayProximity || '--'}</div>
              <div class="kv"><b>Next step</b>${r.nextStep || '--'}</div>
            </div>

            ${(r.claimedUse || r.notes) ? `<div class="meta" style="margin-top:8px;">${r.claimedUse || r.notes}</div>` : ''}

            <div class="links">
              ${sourceUrl ? `<a href="${sourceUrl}" target="_blank" rel="noopener">Open source listing</a>` : ''}
              ${(r.zoningSourceUrl || r.zoningSource) ? `<a href="${r.zoningSourceUrl || r.zoningSource}" target="_blank" rel="noopener">Open zoning source</a>` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    async function init() {
      try {
        const res = await fetch('data.json?' + Date.now());
        data = await res.json();
      } catch (err) {
        data = { listings: [], summary: {}, lastUpdated: null };
      }

      document.getElementById('lastUpdated').textContent = 'Last updated: ' + fmtDate(data.lastUpdated);
      buildStats(data.listings || []);
      populateCityFilter(data.listings || []);
      renderListings();

      ['search','cityFilter','statusFilter','typeFilter','sortBy'].forEach(id => {
        document.getElementById(id).addEventListener('input', renderListings);
        document.getElementById(id).addEventListener('change', renderListings);
      });
    }

    init();
  </script>
</body>
</html>
